<style>
:root{--bg:#f4f7fb;--card:rgba(255,255,255,.7);--tx:#0f1b2d;--mu:#5b6b82;--ac:#0ea5a4;--ac2:#6366f1;--bd:rgba(15,27,45,.12);--ok:#16a34a;--bad:#dc2626;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1220;--card:rgba(255,255,255,.07);--tx:#e8f0fb;--mu:#8fa3bf;--bd:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1220;--card:rgba(255,255,255,.07);--tx:#e8f0fb;--mu:#8fa3bf;--bd:rgba(255,255,255,.14)}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}body{overflow-x:clip;margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;line-height:1.5}
[dir=rtl] body{font-family:Vazirmatn,Inter,sans-serif}
bdi,.f{direction:ltr;unicode-bidi:isolate;display:inline-block}
#bg{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
nav{position:sticky;top:0;z-index:9;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 10px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);background:var(--card);border-bottom:1px solid var(--bd)}
nav b{font-size:18px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-inline-end:auto}
nav a{color:var(--tx);text-decoration:none;font-size:14px;opacity:.8}nav a:hover{opacity:1;color:var(--ac)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:8px 14px;transition:transform .15s,box-shadow .15s}
@media(hover:hover){button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(14,165,164,.25)}}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;padding:14px 26px;font-weight:600;font-size:16px}
input{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;min-width:0}
section{max-width:1100px;margin:auto;padding:56px 18px}
.hero{text-align:center;padding-top:90px}
h1{font-size:clamp(38px,8vw,72px);margin:0;line-height:1.05;font-weight:800}
h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:28px;margin:0 0 6px}
p.s{color:var(--mu);max-width:640px;margin:14px auto 26px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.12)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.rev{opacity:0;transform:translateY(26px);transition:.7s}.rev.in{opacity:1;transform:none}
.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:34px}.stats .card{padding:12px 22px}.stats b{font-size:26px;display:block;color:var(--ac)}
.ctr{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}.ctr label{width:92px}.ctr span{min-width:30px;text-align:center;font-weight:700}
.big{font-size:44px;font-weight:800}
.pt{min-width:620px;display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:4px;direction:ltr}
.el{aspect-ratio:1;border-radius:8px;padding:2px;font-size:clamp(9px,1.6vw,15px);font-weight:700;text-align:center;border:1px solid var(--bd);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.1;transition:transform .15s}
.el small{font-size:.6em;font-weight:400;opacity:.8}@media(hover:hover){.el:hover{transform:scale(1.25);z-index:2}}.el[aria-pressed=true]{outline:3px solid var(--tx)}
.ak{background:#ef444455}.ae{background:#f9731655}.tm{background:#eab30855}.md{background:#84cc1655}.nm{background:#22c55e55}.ha{background:#06b6d455}.ng{background:#8b5cf655}.pt2{background:#3b82f655}.ln{background:#ec489955}.an{background:#a855f755}.ph{aspect-ratio:1;border:1px dashed var(--bd);border-radius:8px;display:grid;place-items:center;font-size:9px;opacity:.7}.bub{animation:rise 1.8s infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-60px);opacity:0}}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:center}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.opt{display:block;width:100%;text-align:start;margin:6px 0}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-end:20px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:10px 18px;border-radius:14px;opacity:0;transform:translateY(20px);transition:.4s;pointer-events:none}#toast.on{opacity:1;transform:none}
#res{position:absolute;top:100%;inset-inline-end:10px;width:260px;max-width:90vw;display:none}#res button{display:block;width:100%;text-align:start;border-radius:0}
.sh{transform-origin:150px 150px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{animation:pop .35s}@keyframes pop{from{transform:scale(.7);opacity:.3}}
.tb th,.tb td{text-align:start;vertical-align:top}svg .pop{transform-box:fill-box;transform-origin:center}#ws g[data-a]:hover circle{filter:drop-shadow(0 0 6px #0ea5a4)}
.cp{padding-top:14px}#m3b button[aria-pressed=true]{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;direction:ltr;margin-top:10px}.kp button{padding:12px 0;min-width:0;font-size:15px}a.pri{display:inline-block;text-decoration:none;border-radius:12px}.ptw{overflow-x:auto;padding:4px}button:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}.gg{display:grid;gap:8px;justify-content:center}.gcard .gg{margin:10px auto 0}
select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;min-width:0;max-width:100%;flex:1 1 200px}select option,select optgroup{background:var(--bg);color:var(--tx)}select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input{font-family:inherit;font-size:16px;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;min-width:0;max-width:100%}input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
a,button,input,select{-webkit-tap-highlight-color:transparent}
canvas{max-width:100%}.card,.grid>*,.ctr>*{min-width:0}svg{max-width:100%}
@media(max-width:700px){
nav{padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;gap:6px 10px}nav b{flex-basis:100%;font-size:16px}nav a{font-size:13px}#q{flex:1;width:auto!important;min-width:100px}#res{inset-inline:10px;width:auto;max-width:none}
section{padding:36px 14px}.hero{padding-top:48px}h2{font-size:23px}.card{padding:14px;border-radius:16px}.big{font-size:32px}.stats .card{padding:10px 16px}
input,select,textarea{font-size:16px}button:not(.el){min-height:40px}
table{display:block;overflow-x:auto;max-width:100%}.pt{min-width:560px}.ctr label{width:auto}
#toast{inset-inline:14px;text-align:center}
}
@media(max-width:400px){.kp{gap:4px}.kp button{font-size:13px}.opt{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
/* ===== pages / routing ===== */
.page{display:none}
.page.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.navlinks{display:flex;gap:6px;align-items:center}
.logo{width:26px;height:26px;vertical-align:-6px;margin-inline-end:7px;filter:drop-shadow(0 2px 6px rgba(14,165,164,.45))}
nav a.nl{padding:7px 12px;border-radius:10px;font-weight:600;opacity:.85;white-space:nowrap}
nav a.nl:hover{opacity:1;color:var(--ac)}
nav a.nl.active{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;opacity:1}
.panel{margin-top:30px;scroll-margin-top:calc(84px + env(safe-area-inset-top,0px))}
.panel:first-of-type{margin-top:8px}
.panel>h2{margin-bottom:2px}
.homegrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));margin-top:32px}
.homegrid a{text-decoration:none;color:inherit;display:block}
.homegrid .card{height:100%;transition:transform .18s,box-shadow .18s}
.homegrid a:hover .card,.homegrid a:focus-visible .card{transform:translateY(-5px);box-shadow:0 18px 44px rgba(14,165,164,.28)}
.homegrid .ic{font-size:34px;line-height:1}.homegrid .ic svg{width:38px;height:38px;fill:none;stroke:var(--ac);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 3px 10px rgba(14,165,164,.35))}
.homegrid h3{margin:8px 0 4px;font-size:20px}
.homegrid p{margin:0;color:var(--mu);font-size:14px}
.gcard{margin-top:16px}
footer{margin-top:44px;border-top:1px solid var(--bd);background:var(--card);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:28px 18px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mu);font-size:14px;line-height:1.7}
footer .fpow{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
footer b{color:var(--tx)}
footer .fnav{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
footer .fnav a{color:var(--mu);text-decoration:none}footer .fnav a:hover{color:var(--ac)}
/* ===== tablet ===== */
@media(max-width:900px){
.navlinks{order:5;flex-basis:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.navlinks::-webkit-scrollbar{display:none}
nav a.nl{flex:none}
section{padding:40px 16px}
}
/* ===== mobile tweaks ===== */
@media(max-width:700px){
button:not(.el):not(.ph){min-height:44px}
.pri{padding:13px 22px}
.homegrid{grid-template-columns:1fr;gap:14px}
.panel{margin-top:24px;scroll-margin-top:calc(96px + env(safe-area-inset-top,0px))}
.grid{gap:14px}
footer{padding:22px 14px calc(22px + env(safe-area-inset-bottom,0px))}
}

/* ===== nav: centered links, hide on scroll, search in table ===== */
nav{transition:transform .35s cubic-bezier(.4,0,.2,1),box-shadow .3s}
nav.nav-hide{transform:translateY(-110%);box-shadow:none}
.navr{display:flex;gap:10px;align-items:center;justify-self:end;margin-inline-start:auto}
#th{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border-radius:999px}
#th svg{display:block}
.navlinks{justify-content:center}
@media(min-width:901px){nav{display:grid;grid-template-columns:1fr auto 1fr}nav b{margin-inline-end:0;justify-self:start}.navlinks{justify-self:center}.navr{justify-self:end}}
@media(max-width:900px){.navlinks{justify-content:center}nav b{flex-basis:auto}}
.ptsearch{position:relative;max-width:420px;margin:10px 0 14px}
.ptsearch #q{width:100%!important}
.ptsearch #res{top:calc(100% + 4px);inset-inline:0;width:auto;max-width:none;z-index:5}
/* scroll reveal */
.sr{opacity:0;transform:translateY(34px) scale(.985);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.sr.sr-in{opacity:1;transform:none}

/* ===== mobile nav: desktop-style bar (brand start, controls end) ===== */
@media(max-width:700px){
nav{display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px}
nav b{margin-inline-end:0;flex-basis:auto;font-size:17px;white-space:nowrap;display:flex;align-items:center}
.logo{width:24px;height:24px;margin-inline-end:6px}
.navr{gap:7px;margin-inline-start:0;flex:0 1 auto;min-width:0}
nav .xpwrap{flex:0 1 auto;flex-wrap:nowrap;column-gap:5px;row-gap:0;min-width:0;min-height:40px;padding:0 11px;border-radius:999px;border:1px solid var(--bd);background:var(--card)}
#xp{font-size:12px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav .xpbar{flex:0 0 auto;width:42px}
#lang,#th{min-height:40px;height:40px;padding:0 13px;border-radius:999px;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center}

V:["A hard, silvery metal that forms colourful compounds across many oxidation states.","High-strength steel alloys, tools, and vanadium redox batteries.","فلزی سخت و نقره‌ای که ترکیب‌های رنگارنگ در حالت‌های اکسایش گوناگون می‌سازد.","آلیاژهای فولاد با استحکام بالا، ابزار و باتری وانادیم ردوکس."],
Cr:["A hard, shiny metal that gives a brilliant, corrosion-resistant finish.","Chrome plating, stainless steel, pigments, and leather tanning.","فلزی سخت و براق که جلای درخشان و مقاوم به خوردگی می‌دهد.","آبکاری کروم، فولاد ضدزنگ، رنگدانه‌ها و دباغی چرم."],
Mn:["A hard, brittle metal crucial to steel-making and to photosynthesis.","Steel alloys, dry-cell batteries, and aluminium cans.","فلزی سخت و شکننده و حیاتی برای فولادسازی و فتوسنتز.","آلیاژهای فولاد، باتری خشک و قوطی آلومینیومی."],
Fe:["The most-used metal on Earth; it forms the planet's core and the haemoglobin in our blood.","Steel, construction, machinery, magnets, and tools.","پرمصرف‌ترین فلز روی زمین؛ هسته سیاره و هموگلوبین خون ما را می‌سازد.","فولاد، ساختمان، ماشین‌آلات، آهنربا و ابزار."],
Co:["A hard, magnetic, lustrous metal that produces deep blue pigments.","Lithium-ion batteries, superalloys, magnets, and blue pigments.","فلزی سخت، مغناطیسی و براق که رنگدانه آبی عمیق تولید می‌کند.","باتری لیتیوم-یون، سوپرآلیاژ، آهنربا و رنگدانه آبی."],
Ni:["A silvery, corrosion-resistant, slightly magnetic metal.","Stainless steel, coins, rechargeable batteries, and electroplating.","فلزی نقره‌ای، مقاوم به خوردگی و کمی مغناطیسی.","فولاد ضدزنگ، سکه، باتری قابل شارژ و آبکاری الکتریکی."],
Cu:["A reddish, ductile metal with excellent electrical and thermal conductivity.","Electrical wiring, plumbing, coins, and electronics.","فلزی سرخ و چکش‌خوار با رسانایی الکتریکی و گرمایی عالی.","سیم‌کشی برق، لوله‌کشی، سکه و الکترونیک."],
Zn:["A bluish-white metal that resists corrosion and is essential in trace nutrition.","Galvanising steel, batteries, brass alloys, and sunscreen.","فلزی سفید-آبی که در برابر خوردگی مقاوم و در تغذیه ناچیز ضروری است.","گالوانیزه کردن فولاد، باتری، آلیاژ برنج و ضدآفتاب."],
Ga:["A soft metal that melts in your hand (29.8 °C); important in semiconductors.","LEDs, semiconductors, solar panels, and low-melting alloys.","فلزی نرم که در دست آب می‌شود (۲۹٫۸ درجه)؛ در نیمه‌رساناها مهم است.","ال‌ای‌دی، نیمه‌رسانا، پنل خورشیدی و آلیاژ زودذوب."],
Ge:["A lustrous metalloid that was important in early transistors and in fibre optics.","Fibre-optic systems, infrared optics, and transistors.","شبه‌فلزی براق که در نخستین ترانزیستورها و فیبر نوری مهم بود.","سامانه فیبر نوری، اپتیک فروسرخ و ترانزیستور."],
As:["A toxic metalloid used historically in pigments and pesticides.","Semiconductors (GaAs), wood preservatives, and lead alloys.","شبه‌فلزی سمی که از گذشته در رنگدانه و آفت‌کش به کار رفته.","نیمه‌رساناها (GaAs)، نگهدارنده چوب و آلیاژ سرب."],
Se:["A nonmetal needed in trace amounts; a semiconductor whose conductivity rises with light.","Photocopiers, glass decolouriser, and anti-dandruff shampoo.","نافلزی ضروری به مقدار ناچیز؛ نیمه‌رسانایی که رسانایی‌اش با نور زیاد می‌شود.","دستگاه کپی، بیرنگ‌کننده شیشه و شامپو ضدشوره."],
Br:["One of only two elements that are liquid at room temperature; a reddish-brown, corrosive, fuming liquid.","Flame retardants, pesticides, and photographic chemicals.","یکی از تنها دو عنصر مایع در دمای اتاق؛ مایع خورنده و بخارکننده قهوه‌ای-سرخ.","کندسوزها، آفت‌کش‌ها و مواد شیمیایی عکاسی."],
Kr:["An inert noble gas that emits a bright whitish glow in lamps.","High-performance lighting, flash photography, and lasers.","گاز نجیب بی‌اثر که در لامپ‌ها نور سفید درخشان می‌دهد.","روشنایی با کارایی بالا، فلاش عکاسی و لیزرها."],
Rb:["A soft, silvery alkali metal that ignites spontaneously in air.","Atomic clocks, vacuum tubes, and specialised glass.","فلز قلیایی نرم و نقره‌ای که در هوا خودبه‌خود آتش می‌گیرد.","ساعت اتمی، لامپ خلأ و شیشه تخصصی."],
Sr:["An alkaline-earth metal whose salts burn a bright red.","Red fireworks and flares, glow-in-the-dark paints, and ferrite magnets.","فلز قلیایی خاکی که نمک‌هایش سرخ روشن می‌سوزند.","آتش‌بازی و منور قرمز، رنگ شب‌تاب و آهنربای فریت."],
Y:["A silvery transition metal and the first of the rare earths.","Phosphors for screens and LEDs, lasers, and superconductors.","فلز واسطه نقره‌ای و نخستین عنصر خاکی کمیاب.","فسفر برای صفحه‌نمایش و ال‌ای‌دی، لیزر و ابررساناها."],
Zr:["A corrosion-resistant metal that barely absorbs neutrons.","Nuclear reactor cladding, zirconia ceramics, and cubic-zirconia gems.","فلزی مقاوم به خوردگی که تقریباً نوترون جذب نمی‌کند.","پوشش راکتور هسته‌ای، سرامیک زیرکونیا و جواهر زیرکونیای مکعبی."],
Nb:["A soft, ductile metal that becomes superconducting at low temperature.","Superconducting magnets (MRI and particle accelerators), and steel alloys.","فلزی نرم و چکش‌خوار که در دمای پایین ابررسانا می‌شود.","آهنربای ابررسانا (MRI و شتاب‌دهنده) و آلیاژ فولاد."],
Mo:["A very high-melting metal that strengthens steel.","High-strength steel alloys, lubricants, and chemical catalysts.","فلزی با نقطه ذوب بسیار بالا که فولاد را تقویت می‌کند.","آلیاژ فولاد مقاوم، روان‌کننده‌ها و کاتالیزور شیمیایی."],
Tc:["The lightest radioactive element; all its isotopes are unstable and mostly synthetic.","Medical imaging (the Tc-99m radioactive tracer).","سبک‌ترین عنصر پرتوزا؛ همه ایزوتوپ‌هایش ناپایدار و عمدتاً مصنوعی‌اند.","تصویربرداری پزشکی (ردیاب پرتوزای Tc-99m)."],
Ru:["A hard, rare platinum-group metal that resists corrosion.","Electrical contacts, wear-resistant alloys, and solar cells.","فلز سخت و کمیاب گروه پلاتین و مقاوم به خوردگی.","کنتاکت الکتریکی، آلیاژ مقاوم به سایش و سلول خورشیدی."],
Rh:["An extremely reflective, corrosion-resistant precious metal.","Catalytic converters, mirrors, and jewellery plating.","فلز گرانبها با بازتاب بسیار و مقاوم به خوردگی.","مبدل کاتالیزوری، آینه و آبکاری جواهرات."],
Pd:["A silvery-white precious metal that absorbs large volumes of hydrogen.","Catalytic converters, electronics, dentistry, and hydrogen purification.","فلز گرانبهای سفید-نقره‌ای که حجم زیادی هیدروژن جذب می‌کند.","مبدل کاتالیزوری، الکترونیک، دندان‌پزشکی و تصفیه هیدروژن."],
Ag:["The best electrical and thermal conductor of all metals; lustrous and precious.","Jewellery, electronics, mirrors, and antibacterial coatings.","بهترین رسانای الکتریکی و گرمایی میان همه فلزها؛ براق و گرانبها.","جواهرات، الکترونیک، آینه و پوشش ضدباکتری."],
Cd:["A soft, toxic, bluish metal once common in pigments and batteries.","Rechargeable NiCd batteries, pigments, and protective plating.","فلز نرم، سمی و آبی‌رنگ که زمانی در رنگدانه و باتری رایج بود.","باتری قابل شارژ NiCd، رنگدانه و آبکاری محافظ."],
In:["A very soft metal that stays malleable even at low temperatures.","Touchscreens (ITO), solders, and low-melting alloys.","فلزی بسیار نرم که حتی در دمای پایین چکش‌خوار می‌ماند.","صفحه لمسی (ITO)، لحیم و آلیاژ زودذوب."],
Sn:["A soft, silvery, malleable metal that resists corrosion; known since antiquity.","Tin cans (plating steel), solder, bronze, and pewter.","فلز نرم، نقره‌ای و چکش‌خوار و مقاوم به خوردگی؛ شناخته‌شده از باستان.","قوطی (پوشش فولاد)، لحیم، برنز و پیوتر."],
Sb:["A brittle, lustrous metalloid used historically in eye cosmetics.","Flame retardants, lead-acid batteries, and semiconductor alloys.","شبه‌فلزی شکننده و براق که از گذشته در آرایش چشم به کار رفته.","کندسوزها، باتری سرب-اسیدی و آلیاژ نیمه‌رسانا."],
Te:["A rare, brittle metalloid that improves the machinability of alloys.","Thermoelectric devices, solar panels (CdTe), and alloys.","شبه‌فلزی کمیاب و شکننده که ماشین‌کاری آلیاژها را بهبود می‌دهد.","ادوات گرمابی، پنل خورشیدی (CdTe) و آلیاژها."],
I:["A dark violet solid that sublimes; essential for making thyroid hormones.","Antiseptics, dietary supplement (iodised salt), and photography.","جامد بنفش تیره که تصعید می‌شود؛ برای ساخت هورمون تیروئید ضروری است.","مواد ضدعفونی، مکمل غذایی (نمک یددار) و عکاسی."],
Xe:["A heavy inert noble gas that emits a bright blue-white light.","High-intensity lamps, car headlights, ion engines, and anaesthetics.","گاز نجیب سنگین و بی‌اثر که نور سفید-آبی درخشان می‌دهد.","لامپ پرنور، چراغ خودرو، موتور یونی و بیهوشی."],
Cs:["The softest and most electropositive stable metal; it explodes on contact with water.","Atomic clocks (which define the second), drilling fluids, and photoelectric cells.","نرم‌ترین و الکتروپوزیتیوترین فلز پایدار؛ در تماس با آب منفجر می‌شود.","ساعت اتمی (که ثانیه را تعریف می‌کند)، سیال حفاری و سلول فوتوالکتریک."],
Ba:["A soft alkaline-earth metal whose compounds are opaque to X-rays.","The medical barium meal X-ray contrast, drilling mud, and green fireworks.","فلز قلیایی خاکی نرم که ترکیب‌هایش نسبت به پرتو ایکس کدرند.","ماده حاجب پرتو ایکس پزشکی، گِل حفاری و آتش‌بازی سبز."],
La:["A soft, silvery rare-earth metal and the first of the lanthanides.","Camera and telescope lenses, catalysts, and nickel-metal-hydride batteries.","فلز خاکی کمیاب نرم و نقره‌ای و نخستین لانتانید.","عدسی دوربین و تلسکوپ، کاتالیزور و باتری نیکل-متال-هیدرید."],
Ce:["The most abundant rare-earth metal; pyrophoric in fine powder form.","Self-cleaning ovens, lighter flints, and catalytic converters.","فراوان‌ترین فلز خاکی کمیاب؛ به شکل پودر خودآتش‌گیر.","فر خودتمیزشونده، سنگ فندک و مبدل کاتالیزوری."],
Pr:["A soft rare-earth metal that produces a distinctive green colour.","Strong magnets, laser glass, and green pigments.","فلز خاکی کمیاب نرم با رنگ سبز متمایز.","آهنربای قوی، شیشه لیزری و رنگدانه سبز."],
Nd:["A rare-earth metal that forms the strongest permanent magnets.","Neodymium magnets in motors, headphones, and hard drives.","فلز خاکی کمیاب که قوی‌ترین آهنرباهای دائم را می‌سازد.","آهنربای نئودیمیم در موتور، هدفون و هارددیسک."],
Pm:["A radioactive rare earth with no stable isotopes; extremely rare.","Luminous paint, nuclear batteries, and thickness gauges.","خاکی کمیاب پرتوزا بدون ایزوتوپ پایدار؛ بسیار کمیاب.","رنگ نورانی، باتری هسته‌ای و سنجه ضخامت."],
Sm:["A rare-earth metal with strong magnetic properties at high temperature.","Samarium-cobalt magnets, lasers, and neutron absorbers.","فلز خاکی کمیاب با خواص مغناطیسی قوی در دمای بالا.","آهنربای ساماریم-کبالت، لیزر و جاذب نوترون."],
Eu:["The most reactive rare-earth metal; it phosphoresces red and blue.","Red and blue phosphors in screens, and euro banknote anti-forgery marks.","واکنش‌پذیرترین فلز خاکی کمیاب؛ به رنگ قرمز و آبی فسفرسانس می‌دهد.","فسفر قرمز و آبی در صفحه‌نمایش و علائم ضدجعل اسکناس یورو."],
Gd:["A rare-earth metal with the highest neutron-capture cross-section of any element.","MRI contrast agents, neutron shielding, and memory chips.","فلز خاکی کمیاب با بیشترین سطح مقطع جذب نوترون.","ماده حاجب MRI، محافظ نوترون و تراشه حافظه."],
Tb:["A rare-earth metal used for green phosphors and for magnetostriction.","Green phosphors, solid-state devices, and actuators.","فلز خاکی کمیاب برای فسفر سبز و مغناطیس‌کشسانی.","فسفر سبز، ادوات حالت جامد و محرک‌ها."],
Dy:["A rare-earth metal critical for magnets that work at high temperature.","Magnets in electric vehicles and wind turbines, nuclear control rods, and lasers.","فلز خاکی کمیاب و حیاتی برای آهنرباهای دمای بالا.","آهنربا در خودرو برقی و توربین بادی، میله کنترل هسته‌ای و لیزر."],
Ho:["A rare-earth metal with the highest magnetic strength of any element.","Medical and dental lasers, nuclear reactor control, and yellow glass.","فلز خاکی کمیاب با بیشترین قدرت مغناطیسی میان همه عناصر.","لیزر پزشکی و دندان‌پزشکی، کنترل راکتور هسته‌ای و شیشه زرد."],
Er:["A rare-earth metal that gives a pink colour and is key to fibre optics.","Optical-fibre amplifiers, lasers, and pink glass or glazes.","فلز خاکی کمیاب با رنگ صورتی و کلیدی در فیبر نوری.","تقویت‌کننده فیبر نوری، لیزر و شیشه یا لعاب صورتی."],
Tm:["The rarest of the stable lanthanides; it emits blue light.","Portable X-ray devices and blue lasers.","کمیاب‌ترین لانتانید پایدار؛ نور آبی می‌دهد.","دستگاه پرتو ایکس قابل حمل و لیزر آبی."],
Yb:["A soft rare-earth metal used in ultra-precise atomic clocks.","Atomic clocks, lasers, and stress gauges.","فلز خاکی کمیاب نرم، به کار رفته در ساعت اتمی بسیار دقیق.","ساعت اتمی، لیزر و سنجه تنش."],
Lu:["The hardest and densest lanthanide; the last of the rare earths.","PET scan detectors, catalysts, and high-refractive-index glass.","سخت‌ترین و چگال‌ترین لانتانید؛ آخرین خاکی کمیاب.","آشکارساز PET، کاتالیزور و شیشه با ضریب شکست بالا."],
Hf:["A corrosion-resistant metal that absorbs neutrons very well.","Nuclear control rods, microchip gate dielectrics, and superalloys.","فلزی مقاوم به خوردگی که نوترون را بسیار خوب جذب می‌کند.","میله کنترل هسته‌ای، دی‌الکتریک گیت ریزتراشه و سوپرآلیاژ."],
Ta:["A hard, corrosion-resistant metal that is highly biocompatible.","Electronic capacitors, surgical implants, and jet-engine alloys.","فلزی سخت، مقاوم به خوردگی و بسیار زیست‌سازگار.","خازن الکترونیکی، ایمپلنت جراحی و آلیاژ موتور جت."],
W:["Has the highest melting point of all metals (3422 °C).","Light-bulb filaments, cutting tools, and radiation shielding.","بالاترین نقطه ذوب میان همه فلزها را دارد (۳۴۲۲ درجه).","رشته لامپ، ابزار برش و محافظ تابش."],
Re:["One of the rarest elements, with an extremely high melting point.","Jet-engine superalloys, and catalysts for high-octane gasoline.","یکی از کمیاب‌ترین عناصر با نقطه ذوب بسیار بالا.","سوپرآلیاژ موتور جت و کاتالیزور بنزین با اکتان بالا."],
Os:["The densest naturally occurring element; extremely hard and brittle.","Fountain-pen tips, electrical contacts, and hard alloys.","چگال‌ترین عنصر طبیعی؛ بسیار سخت و شکننده.","نوک خودنویس، کنتاکت الکتریکی و آلیاژ سخت."],
Ir:["The most corrosion-resistant metal; very dense and hard.","Spark plugs, crucibles for crystal growth, and precision instruments.","مقاوم‌ترین فلز به خوردگی؛ بسیار چگال و سخت.","شمع خودرو، بوته رشد بلور و ابزار دقیق."],
Pt:["A dense, unreactive precious metal and an excellent catalyst.","Catalytic converters, jewellery, lab equipment, and cancer drugs.","فلز گرانبهای چگال و کم‌واکنش و کاتالیزوری عالی.","مبدل کاتالیزوری، جواهرات، تجهیزات آزمایشگاه و داروی سرطان."],
Au:["A dense, lustrous, highly unreactive precious metal that is superbly malleable.","Jewellery, currency reserves, electronics contacts, and dentistry.","فلز گرانبهای چگال، براق و بسیار کم‌واکنش و عالی چکش‌خوار.","جواهرات، ذخایر ارزی، کنتاکت الکترونیک و دندان‌پزشکی."],
Hg:["The only metal that is liquid at room temperature; dense and toxic.","Thermometers (historical), fluorescent lamps, and dental amalgam.","تنها فلزی که در دمای اتاق مایع است؛ چگال و سمی.","دماسنج (قدیمی)، لامپ فلورسنت و آمالگام دندان."],
Tl:["A soft, highly toxic metal once used as rat poison.","Infrared optics, electronics, and medical imaging.","فلز نرم و بسیار سمی که زمانی سم موش بود.","اپتیک فروسرخ، الکترونیک و تصویربرداری پزشکی."],
Pb:["A soft, dense, toxic heavy metal that effectively blocks radiation.","Lead-acid batteries, radiation shielding, and (historically) pipes and paint.","فلز سنگین نرم، چگال و سمی که به‌خوبی جلوی تابش را می‌گیرد.","باتری سرب-اسیدی، محافظ تابش و (قدیمی) لوله و رنگ."],
Bi:["A brittle heavy metal that is remarkably non-toxic and forms rainbow crystals.","Non-toxic lead replacements, medicines (Pepto-Bismol), and cosmetics.","فلز سنگین شکننده و به‌طور قابل توجه غیرسمی که بلورهای رنگین‌کمانی می‌سازد.","جایگزین غیرسمی سرب، دارو (پپتو-بیسمول) و لوازم آرایشی."],
Po:["A highly radioactive, rare metal discovered by Marie Curie.","Anti-static devices and (historically) spacecraft heat sources.","فلز بسیار پرتوزا و کمیاب، کشف‌شده توسط ماری کوری.","ادوات ضدالکتریسیته ساکن و (قدیمی) منبع گرمایی فضاپیما."],
At:["The rarest naturally occurring element; a radioactive halogen.","Medical research, including targeted alpha therapy for cancer.","کمیاب‌ترین عنصر طبیعی؛ هالوژن پرتوزا.","پژوهش پزشکی، از جمله آلفادرمانی هدفمند سرطان."],
Rn:["A radioactive noble gas formed from radium decay; it seeps out of soil.","Limited use; historically in cancer radiotherapy.","گاز نجیب پرتوزا از واپاشی رادیم؛ از خاک نشت می‌کند.","کاربرد محدود؛ از گذشته در پرتودرمانی سرطان."],
Fr:["Extremely rare and radioactive; the second-least stable of the natural elements.","Research only, in studies of atomic structure.","بسیار کمیاب و پرتوزا؛ دومین عنصر طبیعی کم‌پایدار.","فقط پژوهش، در مطالعه ساختار اتمی."],
Ra:["A radioactive alkaline-earth metal that glows faintly blue; discovered by the Curies.","Historically in luminous paint and cancer therapy.","فلز قلیایی خاکی پرتوزا با درخشش آبی کم‌نور؛ کشف‌شده توسط کوری‌ها.","از گذشته در رنگ نورانی و درمان سرطان."],
Ac:["A highly radioactive metal that glows pale blue in the dark.","Neutron sources and targeted alpha radiotherapy.","فلز بسیار پرتوزا که در تاریکی آبی کم‌رنگ می‌درخشد.","چشمه نوترون و آلفادرمانی هدفمند."],

 wrap.addEventListener("click",e=>{if(e.target===wrap)close()});
 RES.addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b){ACT=+b.dataset.i;act()}});
 IN.addEventListener("input",()=>render(IN.value));
 IN.addEventListener("keydown",e=>{
  if(e.key=="ArrowDown"||e.key=="ArrowUp"){e.preventDefault();const bs=RES.querySelectorAll("[data-i]");if(!bs.length)return;bs[ACT]&&bs[ACT].classList.remove("act");ACT=(ACT+(e.key=="ArrowDown"?1:-1)+SHOW.length)%SHOW.length;bs[ACT]&&bs[ACT].classList.add("act");bs[ACT]&&bs[ACT].scrollIntoView({block:"nearest"})}
  else if(e.key=="Enter")act()});
 document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=="k"){e.preventDefault();wrap.classList.contains("on")?close():open()}else if(e.key=="Escape"&&wrap.classList.contains("on"))close()});
 /* nav search button */
 const navr=document.querySelector(".navr");if(navr){const sb=document.createElement("button");sb.id="rv2sBtn";sb.setAttribute("aria-label",X("Search","جست‌وجو"));sb.innerHTML=`<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2"/></svg>`;sb.style.cssText="cursor:pointer";sb.onclick=open;navr.insertBefore(sb,navr.firstChild)}}
RV.refreshSearch=()=>{if(chk("search")){try{RV.reindex()}catch(e){}const b=$("#rv2sBtn");if(b)b.setAttribute("aria-label",X("Search","جست‌وجو"))}};

/* ================================================================
   PWA — service worker + install button
   ================================================================ */
if(chk("pwa")&&"serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
 addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(e=>console.error("RV2 sw:",e))});
 let deferred=null;const btn=document.createElement("button");btn.id="rv2inst";btn.innerHTML=`<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="rv2il">${X("Install","نصب")}</span>`;
 btn.style.cssText="border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;align-items:center";
 const navr=document.querySelector(".navr");if(navr)navr.appendChild(btn);
 addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;btn.classList.add("on")});
 btn.onclick=async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;btn.classList.remove("on")};
 addEventListener("appinstalled",()=>btn.classList.remove("on"));
}
RV.setInstallLabel=()=>{const b=document.querySelector("#rv2inst .rv2il");if(b)b.textContent=X("Install","نصب")};

/* ================================================================
   Lazy build engine + language hooks
   ================================================================ */
if("IntersectionObserver" in window){
 const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){buildP(en.target.id);io.unobserve(en.target)}}),{rootMargin:"480px"});
 Object.values(PANELS).forEach(p=>io.observe(p.el));
}else setTimeout(()=>Object.keys(PANELS).forEach(buildP),1200);
setTimeout(()=>Object.keys(PANELS).forEach(buildP),4000);

/* wrappers around existing global functions (additive monkey-patches) */
const _sel=sel;sel=function(z){_sel(z);try{RV.detail(z)}catch(e){console.error("RV2 detail:",e)}};
const _sh=shortcuts;shortcuts=function(){_sh();try{RV.chips()}catch(e){console.error("RV2 chips:",e)}};
const _go=go;go=function(id){const r=_go(id);try{if(PANELS[id])buildP(id)}catch(e){console.error("RV2 lazy:",e)}return r};
const _route=route;route=function(){const r=_route();try{const h=location.hash.replace(/^#\/?/,"").split("/")[0];if(PANELS[h])buildP(h)}catch(e){console.error("RV2 route:",e)}return r};
const _al=applyL;applyL=function(){const r=_al();try{RV.setInstallLabel();RV.refreshSearch();Object.values(PANELS).forEach(p=>{if(p.done){p.done=0;p.el.innerHTML="";buildP(p.id)}});RV.tab="ov";RV.detail(CZ2)}catch(e){console.error("RV2 lang:",e)}return r};
try{RV.chips()}catch(e){console.error("RV2 chips:",e)}
if(location.hash&&PANELS[location.hash.replace(/^#\/?/,"").split("/")[0]])route();
console.info("RV2 "+RV.v+" ready");
}catch(e){console.error("RV2 init failed (original app unaffected):",e)}
})();
</script>
</body>
</html>
