function go(id){if(CP.includes(id)){tab(id);$("#chem").scrollIntoView({behavior:"smooth"})}else{const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:"smooth"})}}
$("#ct").onclick=e=>{const b=e.target.closest("[data-t]");if(b)tab(b.dataset.t)};
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const id=a.getAttribute("href").slice(1);if(CP.includes(id)||["chem","arcade","math"].includes(id)){e.preventDefault();go(id)}});
tab("atom");if(CP.includes(location.hash.slice(1)))go(location.hash.slice(1));
document.addEventListener("click",e=>{if(!e.target.closest("#res,#q"))R.style.display="none"});
applyL();
</script>
</body>
</html>
